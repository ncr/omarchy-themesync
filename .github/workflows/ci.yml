name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: system libraries (bluer needs libdbus)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo build --locked --release
        working-directory: host
      - run: cargo test --locked --release
        working-directory: host
      - run: cargo clippy --locked --release -- -D warnings -A dead_code
        working-directory: host

  msrv:
    name: msrv (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' host/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --locked
        working-directory: host

  sim:
    name: watch simulator (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && ./theme_sim --selftest
        working-directory: watch/sim
