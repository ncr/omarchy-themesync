<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulanzi Compo</title>
<style>
:root{--bg:#f4f2ee;--fg:#1d1c1a;--muted:#6d6a64;--line:#dedad3;--panel:#0b0b0c;--chip:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#ecebe8;--muted:#9a978f;--line:#2b2a28;--panel:#000;--chip:#1c1c1c}}
:root[data-theme="dark"]{--bg:#121212;--fg:#ecebe8;--muted:#9a978f;--line:#2b2a28;--panel:#000;--chip:#1c1c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}p.lead{margin:0 0 20px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:4px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
label{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
select{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
figure{margin:0}canvas{width:100%;aspect-ratio:52/16;background:var(--panel);border-radius:10px;display:block}
figcaption{margin-top:8px;display:flex;gap:10px;align-items:baseline}figcaption strong{font-size:16px}
figcaption span{color:var(--muted);font-size:14px}figcaption em{margin-left:auto;font-style:normal;color:var(--muted);font:12px ui-monospace,monospace;white-space:nowrap}
footer{color:var(--muted);font-size:13px;margin-top:28px}
</style></head><body><main>
<h1>Compo</h1>
<p class="lead">Osiem pętli bez szwu na Ulanzi TC002, 52 × 16 diod, 60 fps. Ten sam kod co na zegarze.</p>
<div class="bar"><label>Motyw <select id="theme"><option value="bloom">p-bloom</option><option value="jade">osaka-jade</option><option value="gruv">gruvbox</option><option value="nord">nord</option><option value="cat">catppuccin</option></select></label></div>
<div class="grid" id="grid"></div>
<footer>Na zegarze: − / + wybiera pętlę, klik pokrętła włącza lub wyłącza automatyczny pokaz, Ulanzi przełącza dema → sceny zamówień → zegar.</footer>
</main>
<script>
/* RENDERER_SOURCE */
</script>
<script>
/* DEMOS_SOURCE */
</script>
<script>
const D=UlanziDemos,$=id=>document.getElementById(id),themes={bloom:{accent:'4cc9ff',secondary:'b97aff',colors:{foreground:'d9e8ff',yellow:'f5c945',orange:'ff8a3d',cyan:'4fe3d0',red:'ff5468',green:'3ddc97'}},
 jade:{accent:'509475',secondary:'d2689c',colors:{foreground:'c1c497',yellow:'459451',orange:'a2734b',cyan:'2dd5b7',red:'ff5345',magenta:'d2689c'}},
 gruv:{accent:'7daea3',secondary:'d3869b',colors:{foreground:'d4be98',red:'ea6962',green:'a9b665',yellow:'d8a657',orange:'e1875c',cyan:'89b482'}},
 nord:{accent:'81a1c1',secondary:'b48ead',colors:{foreground:'d8dee9',red:'bf616a',green:'a3be8c',yellow:'ebcb8b',orange:'d5967a',cyan:'88c0d0'}},
 cat:{accent:'89b4fa',secondary:'f5c2e7',colors:{foreground:'cdd6f4',red:'f38ba8',green:'a6e3a1',yellow:'f9e2af',orange:'fab387',cyan:'94e2d5'}}};
const cards=D.catalogue.map(m=>{const f=document.createElement('figure');f.innerHTML=`<canvas width="520" height="160"></canvas><figcaption><strong>${m.name}</strong><span>${m.description}</span><em>${m.duration} s</em></figcaption>`;$('grid').append(f);return {m,ctx:f.querySelector('canvas').getContext('2d')};});
function draw(ctx,f){ctx.fillStyle='#000';ctx.fillRect(0,0,520,160);for(let i=0;i<f.length;i++){const c=f[i];if(!c)continue;ctx.fillStyle='#'+c.toString(16).padStart(6,'0');ctx.beginPath();ctx.arc((i%52)*10+5,Math.floor(i/52)*10+5,4.2,0,7);ctx.fill();}}
function tick(now){const theme=themes[$('theme').value];for(const {m,ctx} of cards)draw(ctx,D.frame(m.id,now/1000+m.duration*.35,theme));requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script></body></html>
