[package]
name = "omarchy-themesync"
version = "0.1.0"
edition = "2021"
# Not tested locally below the current stable (no rustup here); the CI `msrv` job builds with
# exactly this version and is the check.
rust-version = "1.85"
description = "The Omarchy desktop theme on your smartwatch over BLE, both ways: a signed advertising beacon plus a request scanner, and the CLI around it"
license = "MIT"
license-file = "../LICENSE"
repository = "https://github.com/ncr/omarchy-themesync"
homepage = "https://github.com/ncr/omarchy-themesync"
readme = "../README.md"
keywords = ["omarchy", "bluetooth", "ble", "theme", "smartwatch"]
categories = ["command-line-utilities", "hardware-support"]
publish = false

[[bin]]
name = "themesync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "signal"] }
btleplug = "0.12"
futures = "0.3"
uuid = "1"
hmac = "0.13.0"
sha2 = "0.11.0"
subtle = "2"

# The daemon (state beacon + request scan) talks to BlueZ over D-Bus: Linux only. Everything
# else (GATT via btleplug, the codecs, `push-list --direct`) builds and runs on macOS too.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
