[package]
name = "omarchy-themesync"
version = "0.1.0"
edition = "2021"
description = "Push the active Omarchy desktop theme to external devices (Theme Protocol v1; smartwatch over BLE first)"
license = "MIT"

[[bin]]
name = "themesync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "signal"] }
btleplug = "0.12"
futures = "0.3"
uuid = "1"
hmac = "0.13.0"
sha2 = "0.11.0"

# The daemon (state beacon + request scan) talks to BlueZ over D-Bus: Linux only. Everything
# else (GATT via btleplug, the codecs, `push-list --direct`) builds and runs on macOS too.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }

[profile.release]
strip = true
lto = "thin"
